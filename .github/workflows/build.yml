name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: ดึงไฟล์โค้ดจากโปรเจกต์
        uses: actions/checkout@v4

      - name: ติดตั้ง Node.js บนเซิร์ฟเวอร์
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ติดตั้ง Electron และแพ็กเกจ
        run: npm install

      - name: สร้างไฟล์โปรแกรม .exe
        run: npm run dist

      - name: อัปโหลดไฟล์ .zip เตรียมให้ดาวน์โหลด
        uses: actions/upload-artifact@v4
        with:
          name: PEA-Electric-App-Windows
          path: dist/*.zip
