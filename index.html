    <!-- 🔐 ระบบตรวจรหัสผ่านที่หลังบ้าน 100% + แยกชีตตาม กฟส. อัตโนมัติ (Level 2 Backend Auth + Auto-Shard สำหรับ index.html) -->
    <script>
        // แนบชื่อกลุ่มสังกัด (group) และสิทธิ์ (role) ไปกับคำสั่งซิงค์ทุกครั้ง เพื่อให้ Code.gs เปิดไฟล์ชีตประจำ กฟส. อัตโนมัติ
        const _prevFetchForAutoShard = window.fetch;
        window.fetch = async function(input, init) {
            if (typeof input === 'string' && input.includes('script.google.com') && !input.includes('group=')) {
                const curGroup = (typeof getCurrentUserGroup === 'function' ? getCurrentUserGroup() : '') ||
                    localStorage.getItem('elec_app_current_group') || '';
                const curRole = localStorage.getItem('elec_app_current_role') || 'user';
                const sep = input.includes('?') ? '&' : '?';
                input = `${input}${sep}group=${encodeURIComponent(curGroup)}&role=${encodeURIComponent(curRole)}`;
            }
            return _prevFetchForAutoShard.call(this, input, init);
        };
        
        (function() {
            // 1. บังคับให้การดึงและบันทึกบัญชีผู้ใช้ของ Admin อ่าน/เขียนที่ชีตหลัก (CLOUD_USER_API_URL) เสมอ
            window.fetchUserAccountsFromCloud = async function(silent = true, forceFetch = false) {
                if (!forceFetch && (isSavingUsersToCloud || (Date.now() - lastCloudSaveTimestamp < 6000))) return true;
                const statusEl = document.getElementById('cloudSyncStatusText');
                if (statusEl && !silent) statusEl.textContent = '⏳ กำลังดึงข้อมูลบัญชีจากชีตหลัก...';
                try {
                    const res = await fetch(CLOUD_USER_API_URL + '?t=' + Date.now(), { method: 'GET', cache: 'no-store' });
                    const data = await res.json();
                    if (data && data.status === 'ok' && Array.isArray(data.users) && data.users.length > 0) {
                        userAccountsList = data.users.map(parseAccountRecord);
                        localStorage.setItem('elec_user_accounts', JSON.stringify(userAccountsList));
                        if (statusEl) statusEl.textContent = `🟢 ซิงค์บัญชีจากชีตหลักล่าสุดแล้ว (${userAccountsList.length} บัญชี)`;
                        if (document.getElementById('userManageModal') && !document.getElementById('userManageModal').classList.contains('hidden')) {
                            renderUserAccountList();
                        }
                        verifyActiveSessionRole();
                        return true;
                    }
                } catch (err) {}
                return false;
            };
            
            window.saveUserAccounts = async function() {
                localStorage.setItem('elec_user_accounts', JSON.stringify(userAccountsList));
                if (typeof performAutoBackupSnapshot === 'function') performAutoBackupSnapshot();
                isSavingUsersToCloud = true;
                lastCloudSaveTimestamp = Date.now();
                const statusEl = document.getElementById('cloudSyncStatusText');
                if (statusEl) statusEl.textContent = '⏳ กำลังบันทึกบัญชีและสร้างชีตประจำ กฟส. อัตโนมัติ...';
                try {
                    if (typeof window.__unlockCloudWrite === 'function') window.__unlockCloudWrite();
                    const payloadUsers = userAccountsList.map(u => ({
                        username: normalizeUsernameFormat(u.username),
                        password: u.password,
                        role: `${u.role || 'user'}::${u.sessionToken || ''}::${(u.displayName || '').replace(/::/g, ' ').trim()}`
                    }));
                    const res = await fetch(CLOUD_USER_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'saveUsers', users: payloadUsers })
                    });
                    const data = await res.json();
                    isSavingUsersToCloud = false;
                    lastCloudSaveTimestamp = Date.now();
                    if (data && data.status === 'ok') {
                        if (statusEl) statusEl.textContent = '🟢 บันทึกบัญชีสำเร็จ (เข้ารหัส SHA-256 & เชื่อมชีต กฟส. อัตโนมัติแล้ว)';
                        return true;
                    }
                } catch (err) {
                    isSavingUsersToCloud = false;
                }
                return false;
            };
            
            // 2. ล็อกอินที่ชีตหลักเสมอ และสลับท่อข้อมูลไปชีตประจำ กฟส. อัตโนมัติ
            window.handleLogin = async function() {
                const userInput = document.getElementById('loginUsername');
                const passInput = document.getElementById('loginPassword');
                const username = (userInput?.value || '').trim();
                const pass = (passInput?.value || '').trim();
                
                if (!username || !pass) {
                    showCustomAlert("⚠️ กรุณากรอกรหัสพนักงานและรหัสผ่านให้ครบถ้วน", "⚡ ระบบจัดการงานไฟฟ้า");
                    return;
                }
                
                const loginBtn = document.querySelector('#loginScreen button[onclick="handleLogin()"]');
                const origBtnText = loginBtn ? loginBtn.textContent : 'เข้าสู่ระบบ';
                if (loginBtn) {
                    loginBtn.disabled = true;
                    loginBtn.textContent = '⏳ กำลังตรวจสอบรหัสผ่านที่เซิร์ฟเวอร์...';
                }
                
                try {
                    if (typeof window.__unlockCloudWrite === 'function') window.__unlockCloudWrite();
                    localStorage.removeItem('elec_sheet_cache_2k');
                    
                    const now = Date.now();
                    const newSessionToken = 'sess_' + now + '_' + Math.random().toString(36).substring(2, 8);
                    const res = await fetch(CLOUD_USER_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'verifyLogin',
                            username: username,
                            password: pass,
                            sessionToken: newSessionToken
                        })
                    });
                    const data = await res.json();
                    
                    if (loginBtn) {
                        loginBtn.disabled = false;
                        loginBtn.textContent = origBtnText;
                    }
                    
                    if (data && data.status === 'ok' && data.authenticated && data.user) {
                        if (Array.isArray(data.users) && data.users.length > 0) {
                            userAccountsList = data.users.map(parseAccountRecord);
                            localStorage.setItem('elec_user_accounts', JSON.stringify(userAccountsList));
                        }
                        
                        if (data.targetApiUrl && String(data.targetApiUrl).startsWith('https://script.google.com/')) {
                            localStorage.setItem('elec_cloud_user_api_url', String(data.targetApiUrl).trim());
                        } else {
                            localStorage.removeItem('elec_cloud_user_api_url');
                        }
                        
                        const fullCanonicalName = normalizeUsernameFormat(data.user.username);
                        const boundGroup = getUserGroupName(fullCanonicalName);
                        const userRole = data.user.role || 'user';
                        const activeToken = data.user.sessionToken || newSessionToken;
                        
                        localStorage.setItem('elec_app_logged_in', 'true');
                        localStorage.setItem('elec_app_current_user', fullCanonicalName);
                        localStorage.setItem('elec_app_current_group', boundGroup);
                        localStorage.setItem('elec_app_current_role', userRole);
                        localStorage.setItem('elec_app_session_token', activeToken);
                        localStorage.setItem('elec_app_last_active', Date.now().toString());
                        
                        if (userInput) userInput.value = '';
                        if (passInput) passInput.value = '';
                        
                        if (userRole === 'tech') {
                            window.location.href = 'page2.html';
                            return;
                        }
                        
                        checkLoginStatus();
                        if (typeof pullFieldReportsFromCloud === 'function') pullFieldReportsFromCloud(true);
                        if (typeof loadOutageHistory === 'function') loadOutageHistory();
                        if (typeof loadFaultHistory === 'function') loadFaultHistory();
                        showToast(`🔓 ยินดีต้อนรับคุณ ${formatTechDisplayName(fullCanonicalName)}`);
                    } else {
                        showCustomAlert("❌ รหัสพนักงาน หรือ รหัสผ่านไม่ถูกต้อง กรุณาลองอีกครั้ง", "⚡ ระบบจัดการงานไฟฟ้า");
                        if (passInput) {
                            passInput.value = '';
                            passInput.focus();
                        }
                    }
                } catch (err) {
                    if (loginBtn) {
                        loginBtn.disabled = false;
                        loginBtn.textContent = origBtnText;
                    }
                    showCustomAlert("⚠️ ไม่สามารถติดต่อเซิร์ฟเวอร์ตรวจสอบรหัสผ่านได้ กรุณาตรวจสอบอินเทอร์เน็ต", "⚡ ระบบจัดการงานไฟฟ้า");
                }
            };
            
            // 3. ซ่อนปุ่มดูรหัสผ่านในหน้าจัดการผู้ใช้ของ Admin (เนื่องจากเข้ารหัส SHA-256 แล้ว)
            const _origRenderUserList = window.renderUserAccountList;
            if (typeof _origRenderUserList === 'function') {
                window.renderUserAccountList = function(...args) {
                    const res = _origRenderUserList.apply(this, args);
                    document.querySelectorAll('button[onclick^="togglePasswordMask"]').forEach(btn => btn.remove());
                    document.querySelectorAll('strong[id^="pw-mask-"]').forEach(el => {
                        el.textContent = '🔒 เข้ารหัส SHA-256';
                        el.className = 'text-[10px] text-emerald-700 bg-emerald-50 border border-emerald-200 px-1.5 py-0.5 rounded font-semibold';
                    });
                    return res;
                };
            }
            
            // 4. ให้หน้าแก้ไขบัญชีผู้ใช้สามารถเว้นว่างช่องรหัสผ่านเพื่อคงรหัสผ่านเดิมไว้ได้
            const _origEditUserAcc = window.editUserAccount;
            if (typeof _origEditUserAcc === 'function') {
                window.editUserAccount = function(index) {
                    _origEditUserAcc.apply(this, arguments);
                    const pInput = document.getElementById('editAccPasswordInput');
                    const saveBtn = document.getElementById('editAccSaveBtn');
                    if (pInput) {
                        pInput.value = '';
                        pInput.placeholder = 'เว้นว่างไว้หากใช้รหัสผ่านเดิม (พิมพ์ใหม่เพื่อเปลี่ยน)';
                    }
                    if (saveBtn && pInput) {
                        const origClick = saveBtn.onclick;
                        saveBtn.onclick = function() {
                            if (!pInput.value.trim()) {
                                pInput.value = 'UNCHANGED';
                            }
                            if (typeof origClick === 'function') origClick.apply(this, arguments);
                        };
                    }
                };
            }
        })();
    </script>
